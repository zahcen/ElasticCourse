apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: fleet-agent
  namespace: elastic-system
spec:
  version: 9.1.2
  mode: fleet
  fleetServerRef:
    name: fleet-server
    namespace: elastic-system
  policyID: "Fleet Server Policy"
  deployment:
    replicas: 2
    podTemplate:
      spec:
        containers:
          - name: agent
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
